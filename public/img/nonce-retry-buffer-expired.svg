40px);opacity:1}70.67%{transform:translate(791px,262px);opacity:1}97.33%{transform:translate(791px,262px);opacity:1}100.00%{transform:translate(791px,262px);opacity:0}}.o4{animation-name:o4}@keyframes n8{0.00%{transform:translate(-140px,140px) rotate(0deg);opacity:0}17.33%{transform:translate(-140px,140px) rotate(0deg);opacity:0}18.67%{transform:translate(-140px,140px) rotate(0deg);opacity:1}25.33%{transform:translate(360px,140px) rotate(0deg);opacity:1}29.33%{transform:translate(360px,310px) rotate(0deg);opacity:1}61.33%{transform:translate(360px,310px) rotate(0deg);opacity:1}63.67%{transform:translate(210px,240px) rotate(-25deg);opacity:1}66.00%{transform:translate(70px,270px) rotate(-60deg);opacity:0}100.00%{transform:translate(70px,270px) rotate(-60deg);opacity:0}}.n8{animation-name:n8}@keyframes err{0.00%{transform:translate(80px,236px) rotate(0deg);opacity:0}65.33%{transform:translate(80px,236px) rotate(0deg);opacity:0}68.00%{transform:translate(80px,236px) rotate(0deg);opacity:1}97.33%{transform:translate(80px,236px) rotate(0deg);opacity:1}100.00%{transform:translate(80px,236px) rotate(0deg);opacity:0}}.err{animation-name:err}@keyframes n7{0.00%{transform:translate(-140px,140px) rotate(0deg);opacity:0}72.00%{transform:translate(-140px,140px) rotate(0deg);opacity:0}73.33%{transform:translate(-140px,140px) rotate(0deg);opacity:1}80.00%{transform:translate(360px,140px) rotate(0deg);opacity:1}83.33%{transform:translate(500px,140px) rotate(0deg);opacity:1}88.00%{transform:translate(791px,304px) rotate(0deg);opacity:1}97.33%{transform:translate(791px,304px) rotate(0deg);opacity:1}100.00%{transform:translate(791px,304px) rotate(0deg);opacity:0}}.n7{animation-name:n7}@keyframes boot{0.00%{transform:translate(620px,290px) rotate(0deg);opacity:0}58.00%{transform:translate(620px,290px) rotate(0deg);opacity:0}59.33%{transform:translate(620px,290px) rotate(20deg);opacity:1}61.33%{transform:translate(472px,290px) rotate(-10deg);opacity:1}63.00%{transform:translate(482px,290px) rotate(-10deg);opacity:1}66.00%{transform:translate(620px,290px) rotate(20deg);opacity:0}100.00%{transform:translate(620px,290px) rotate(0deg);opacity:0}}.boot{animation-name:boot}@keyframes timer{0%{transform:scaleX(1)}26.67%{transform:scaleX(1)}60.00%{transform:scaleX(0)}100%{transform:scaleX(0)}}.timer{animation-name:timer}@keyframes c1{0%{opacity:1}17.33%{opacity:0}100%{opacity:0}}.c1{animation-name:c1}@keyframes c2{0%{opacity:0}17.33%{opacity:1}40.00%{opacity:0}100%{opacity:0}}.c2{animation-name:c2}@keyframes c3{0%{opacity:0}40.00%{opacity:1}61.33%{opacity:0}100%{opacity:0}}.c3{animation-name:c3}@keyframes c4{0%{opacity:0}60.00%{opacity:1}72.00%{opacity:0}100%{opacity:0}}.c4{animation-name:c4}@keyframes c5{0%{opacity:0}72.00%{opacity:1}100%{opacity:1}}.c5{animation-name:c5}</style>
<rect x="0" y="0" width="1000" height="470" fill="url(#brandbg)"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="150" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#9dcced">Incoming transactions</text>
<text x="500.0" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#9dcced">Sequencer</text>
