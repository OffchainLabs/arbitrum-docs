<g id="o3" class="chip o3" opacity="1.00" transform="translate(791 220) rotate(0.0)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
<g id="o4" class="chip o4" opacity="1.00" transform="translate(791 262) rotate(0.0)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
<g id="n8" class="chip n8" opacity="0.00" transform="translate(360 310) rotate(0.0)"><rect width="118" height="32" rx="8" fill="#12aaff"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#0b1b2e">nonce 8</text></g>
<g id="n7" class="chip n7" opacity="1.00" transform="translate(791 304) rotate(0.0)"><rect width="118" height="32" rx="8" fill="#12aaff"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#0b1b2e">nonce 7</text></g>
<g id="err" class="chip err" opacity="1.00" transform="translate(80 236) rotate(0.0)"><rect width="168" height="32" rx="8" fill="#e6007a"/><text x="84" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">nonce too high</text><text x="0" y="-12" font-size="15" fill="#eaf5ff">Returned to your sender:</text></g>
