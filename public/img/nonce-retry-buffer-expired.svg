<rect x="330" y="60" width="340" height="320" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.5"/>
<rect x="348" y="110" width="304" height="90" rx="10" fill="#213147"/>
<text x="360" y="130" font-size="17" fill="#c9dcef">Queue · executes in nonce order</text>
<rect x="348" y="240" width="304" height="110" rx="10" fill="#213147"/>
<text x="360" y="260" font-size="17" fill="#c9dcef">Retry buffer · holds a nonce gap</text>
<text x="360" y="282" font-size="15" fill="#c9dcef">Expiry timer (1 s by default)</text>
<rect x="360" y="290" width="280" height="10" rx="5" fill="#0b1b2e"/>
<rect class="timer" style="transform:scaleX(0)" x="360" y="290" width="280" height="10" rx="5" fill="#12aaff"/>
<rect x="760" y="100" width="180" height="250" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.5"/>
<text x="850.0" y="124" text-anchor="middle" font-size="16" fill="#c9dcef">Executed, in order</text>
<path d="M190 157 L340 157" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M678 157 L750 157" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="352" width="280" height="34" rx="8" fill="#152c4e" opacity="0.92"/>
<rect x="50" y="360" width="18" height="18" rx="4" fill="#12aaff"/><text x="74" y="374" font-size="16" fill="#eaf5ff">Your sender</text>
<rect x="176" y="360" width="18" height="18" rx="4" fill="#213147"/><text x="200" y="374" font-size="16" fill="#eaf5ff">Other senders</text>
<g class="caption c1" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Other senders' transactions pass through the queue in arrival order.</text></g>
<g class="caption c2" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 8 arrives before nonce 7: the sequencer holds it and starts the timer.</text></g>
<g class="caption c3" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 7 does not arrive. The timer runs out.</text></g>
<g class="caption c4" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">The sequencer drops nonce 8 and returns nonce too high to your sender.</text></g>
<g class="caption c5" opacity="1"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 7 arrives late and executes. Resend nonce 8.</text></g>
<g id="o1" class="chip o1" opacity="1.00" transform="translate(791 136) rotate(0.0)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
