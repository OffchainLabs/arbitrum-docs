<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Nonce retry buffer: nonce 7 arrives late and nonce 8 fails with nonce too high</title>
<desc id="d">Animated diagram of the sequencer's nonce retry buffer when the timer expires. Transactions from other senders enter the sequencer queue from the left and land in a block on the right. Your transaction with nonce 8 arrives before nonce 7, so the sequencer moves it into the retry buffer and starts the expiry timer. Nonce 7 does not arrive and the timer runs out. The sequencer drops nonce 8 and returns the error nonce too high to your sender. Nonce 7 then arrives late and executes normally, so your sender must resend nonce 8.</desc>
<defs>
<linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#152c4e"/><stop offset="0.55" stop-color="#1b4add"/><stop offset="1" stop-color="#12aaff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/></marker>
</defs>
