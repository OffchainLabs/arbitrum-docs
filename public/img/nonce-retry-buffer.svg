<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d">
<title id="t">Nonce retry buffer: nonce 8 arrives before nonce 7 and both execute</title>
<desc id="d">Animated diagram of the sequencer's nonce retry buffer. Transactions from other senders enter the sequencer queue from the left and land in a block on the right. Our transaction with nonce 8 arrives before nonce 7, so the sequencer moves it into the retry buffer and starts the expiry timer. Nonce 7 arrives while the timer is still running and executes. The sequencer then revives nonce 8 from the buffer and executes it next.</desc>
<defs>
<linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#152c4e"/><stop offset="0.55" stop-color="#1b4add"/><stop offset="1" stop-color="#12aaff"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/></marker>
</defs>
<style>.chip{animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}.caption{animation-duration:12s;animation-timing-function:step-end;animation-iteration-count:infinite}.timer{transform-box:fill-box;transform-origin:left center;animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite}@media (prefers-reduced-motion:reduce){.chip,.caption,.timer{animation:none}}@keyframes o1{0.00%{transform:translate(-140px,140px);opacity:0}2.50%{transform:translate(-140px,140px);opacity:0}4.17%{transform:translate(-140px,140px);opacity:1}12.50%{transform:translate(360px,140px);opacity:1}16.67%{transform:translate(500px,140px);opacity:1}22.50%{transform:translate(791px,136px);opacity:1}96.67%{transform:translate(791px,136px);opacity:1}100.00%{transform:translate(791px,136px);opacity:0}}.o1{animation-name:o1}@keyframes o2{0.00%{transform:translate(-140px,140px);opacity:0}11.67%{transform:translate(-140px,140px);opacity:0}13.33%{transform:translate(-140px,140px);opacity:1}21.67%{transform:translate(360px,140px);opacity:1}25.83%{transform:translate(500px,140px);opacity:1}31.67%{transform:translate(791px,178px);opacity:1}96.67%{transform:translate(791px,178px);opacity:1}100.00%{transform:translate(791px,178px);opacity:0}}.o2{animation-name:o2}@keyframes o3{0.00%{transform:translate(-140px,140px);opacity:0}52.50%{transform:translate(-140px,140px);opacity:0}54.17%{transform:translate(-140px,140px);opacity:1}62.50%{transform:translate(360px,140px);opacity:1}66.67%{transform:translate(500px,140px);opacity:1}72.50%{transform:translate(791px,262px);opacity:1}96.67%{transform:translate(791px,262px);opacity:1}100.00%{transform:translate(791px,262px);opacity:0}}.o3{animation-name:o3}@keyframes n8{0.00%{transform:translate(-140px,140px);opacity:0}21.67%{transform:translate(-140px,140px);opacity:0}23.33%{transform:translate(-140px,140px);opacity:1}31.67%{transform:translate(360px,140px);opacity:1}36.67%{transform:translate(360px,310px);opacity:1}63.33%{transform:translate(360px,310px);opacity:1}68.33%{transform:translate(360px,140px);opacity:1}72.50%{transform:translate(500px,140px);opacity:1}78.33%{transform:translate(791px,304px);opacity:1}96.67%{transform:translate(791px,304px);opacity:1}100.00%{transform:translate(791px,304px);opacity:0}}.n8{animation-name:n8}@keyframes n7{0.00%{transform:translate(-140px,140px);opacity:0}41.67%{transform:translate(-140px,140px);opacity:0}43.33%{transform:translate(-140px,140px);opacity:1}51.67%{transform:translate(360px,140px);opacity:1}55.83%{transform:translate(500px,140px);opacity:1}61.67%{transform:translate(791px,220px);opacity:1}96.67%{transform:translate(791px,220px);opacity:1}100.00%{transform:translate(791px,220px);opacity:0}}.n7{animation-name:n7}@keyframes timer{0%{transform:scaleX(1)}33.33%{transform:scaleX(1)}51.67%{transform:scaleX(0.56)}96.67%{transform:scaleX(0.56)}100%{transform:scaleX(0.56)}}.timer{animation-name:timer}@keyframes c1{0%{opacity:1}21.67%{opacity:0}100%{opacity:0}}.c1{animation-name:c1}@keyframes c2{0%{opacity:0}21.67%{opacity:1}41.67%{opacity:0}100%{opacity:0}}.c2{animation-name:c2}@keyframes c3{0%{opacity:0}41.67%{opacity:1}63.33%{opacity:0}100%{opacity:0}}.c3{animation-name:c3}@keyframes c4{0%{opacity:0}63.33%{opacity:1}100%{opacity:1}}.c4{animation-name:c4}</style>
<rect x="0" y="0" width="1000" height="470" fill="url(#brandbg)"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<text x="150" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#9dcced">Incoming transactions</text>
<text x="500.0" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#9dcced">Sequencer</text>
<text x="850.0" y="40" text-anchor="middle" font-size="20" font-weight="600" fill="#9dcced">Block</text>
<rect x="330" y="60" width="340" height="320" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.5"/>
<rect x="348" y="110" width="304" height="90" rx="10" fill="#213147"/>
<text x="360" y="130" font-size="17" fill="#c9dcef">Queue · executes in nonce order</text>
<rect x="348" y="240" width="304" height="110" rx="10" fill="#213147"/>
<text x="360" y="260" font-size="17" fill="#c9dcef">Retry buffer · holds a nonce gap</text>
<text x="360" y="282" font-size="15" fill="#c9dcef">Expiry timer (1 s by default)</text>
<rect x="360" y="290" width="280" height="10" rx="5" fill="#0b1b2e"/>
<rect class="timer" x="360" y="290" width="280" height="10" rx="5" fill="#12aaff"/>
<rect x="760" y="100" width="180" height="250" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.5"/>
<text x="850.0" y="124" text-anchor="middle" font-size="16" fill="#c9dcef">Executed, in order</text>
<path d="M190 157 L340 157" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M678 157 L750 157" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="40" y="352" width="300" height="34" rx="8" fill="#152c4e" opacity="0.92"/>
<rect x="54" y="360" width="18" height="18" rx="4" fill="#12aaff"/><text x="80" y="374" font-size="16" fill="#eaf5ff">Your sender</text>
<rect x="194" y="360" width="18" height="18" rx="4" fill="#213147"/><text x="220" y="374" font-size="16" fill="#eaf5ff">Other senders</text>
<g class="caption c1" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Other senders' transactions pass through the queue in arrival order.</text></g>
<g class="caption c2" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 8 arrives before nonce 7: the sequencer holds it and starts the timer.</text></g>
<g class="caption c3" opacity="0"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 7 arrives inside the window and executes.</text></g>
<g class="caption c4" opacity="1"><rect x="40" y="408" width="920" height="38" rx="8" fill="#152c4e" opacity="0.92"/><text x="500.0" y="433" text-anchor="middle" font-size="18" fill="#eaf5ff">Nonce 8 is revived from the buffer and executes next.</text></g>
<g id="o1" class="chip o1" transform="translate(791 136)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
<g id="o2" class="chip o2" transform="translate(791 178)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
<g id="o3" class="chip o3" transform="translate(791 262)"><rect width="118" height="32" rx="8" fill="#213147"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#ffffff">tx</text></g>
<g id="n7" class="chip n7" transform="translate(791 220)"><rect width="118" height="32" rx="8" fill="#12aaff"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#0b1b2e">nonce 7</text></g>
<g id="n8" class="chip n8" transform="translate(791 304)"><rect width="118" height="32" rx="8" fill="#12aaff"/><text x="59.0" y="23" text-anchor="middle" font-size="18" font-weight="600" fill="#0b1b2e">nonce 8</text></g>
</g></svg>
