<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480" role="img" aria-labelledby="trtitle trdesc">
<title id="trtitle">The scalability trilemma</title>
<desc id="trdesc">A triangle with one property at each corner. Ethereum maximizes decentralization and security, shown in blue at the two lower corners and the top corner. Scalability, shown in dark grey, is capped as a result. Rollups like Arbitrum add scalability without weakening the other two.</desc>
<defs>
<linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#152c4e"/>
<stop offset="0.55" stop-color="#1b4add"/>
<stop offset="1" stop-color="#12aaff"/>
</linearGradient>
</defs>
<rect x="0" y="0" width="800" height="480" fill="url(#brandbg)"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<path d="M400 72 L620 350 L180 350 Z" fill="none" stroke="#9dcced" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="265" y="30" width="270" height="84" rx="14" fill="#12aaff"/>
<text x="400" y="66" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1b2e">Security</text>
<text x="400" y="94" text-anchor="middle" font-size="17" font-weight="400" fill="#0b2438">Ethereum maximizes</text>
<rect x="45" y="308" width="270" height="84" rx="14" fill="#12aaff"/>
<text x="180" y="344" text-anchor="middle" font-size="24" font-weight="700" fill="#0b1b2e">Decentralization</text>
<text x="180" y="372" text-anchor="middle" font-size="17" font-weight="400" fill="#0b2438">Ethereum maximizes</text>
<rect x="485" y="308" width="270" height="84" rx="14" fill="#213147" stroke="#9dcced" stroke-opacity="0.35" stroke-width="1.5"/>
<text x="620" y="344" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">Scalability</text>
<text x="620" y="372" text-anchor="middle" font-size="17" font-weight="400" fill="#c9dcef">capped as a result</text>
<text x="400" y="450" text-anchor="middle" font-size="18" font-weight="600" fill="#0b1b2e">Rollups like Arbitrum add scalability without weakening the other two.</text>
</g>
</svg>
