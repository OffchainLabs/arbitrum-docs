<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-labelledby="t d">
<title id="t">Web2 vending machine architecture</title>
<desc id="d">Web2 architecture of the cupcake vending machine. A user talks to the vending machine app. The app runs across four layers: servers, network, device and browser. The servers layer holds three concerns: data (the cupcakes), business logic and presentation (the UI). Everything the app depends on lives on centralized servers.</desc>
