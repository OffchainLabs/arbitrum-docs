<text x="330.0" y="245.9" font-size="22" font-weight="600" fill="#0b1b2e" text-anchor="middle">machine</text>
<path d="M176 225.0 L232 225.0" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="500" y="56" width="200" height="54" rx="10" fill="#213147"/>
<text x="600.0" y="90.7" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">Servers</text>
<rect x="500" y="136" width="200" height="54" rx="10" fill="#213147"/>
