<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img"><title>What each conditional option reads</title><desc>Three boxes. blockNumberMin and blockNumberMax read the parent chain block number. timestampMin and timestampMax read the child chain block timestamp. knownAccounts reads child chain contract storage.</desc><defs><linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#152c4e"/><stop offset="0.55" stop-color="#1b4add"/><stop offset="1" stop-color="#12aaff"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/></marker></defs><rect x="0" y="0" width="1000" height="330" fill="url(#brandbg)"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><text x="500.0" y="50" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="600" fill="#eaf5ff" text-anchor="middle" xml:space="preserve">Each option reads a different source</text><rect x="30" y="92" width="300" height="190" rx="14" fill="#12aaff"/><text x="180" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">blockNumberMin</text><text x="180" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">blockNumberMax</text><rect x="70" y="178" width="220" height="1.5" fill="#0b1b2e" opacity="0.45"/><text x="180" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">Parent chain</text><text x="180" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b2438" text-anchor="middle" xml:space="preserve">block number</text><rect x="350" y="92" width="300" height="190" rx="14" fill="#12aaff"/><text x="500" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">timestampMin</text><text x="500" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">timestampMax</text><rect x="390" y="178" width="220" height="1.5" fill="#0b1b2e" opacity="0.45"/><text x="500" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b1b2e" text-anchor="middle" xml:space="preserve">Child chain</text><text x="500" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#0b2438" text-anchor="middle" xml:space="preserve">block timestamp</text><rect x="670" y="92" width="300" height="190" rx="14" fill="#e6007a"/><text x="820" y="143" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle" xml:space="preserve">knownAccounts</text><rect x="710" y="178" width="220" height="1.5" fill="#ffffff" opacity="0.45"/><text x="820" y="216" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle" xml:space="preserve">Child chain</text><text x="820" y="242" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#ffffff" text-anchor="middle" xml:space="preserve">contract storage</text></g></svg>
