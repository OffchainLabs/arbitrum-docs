<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" version="1.1">
  <title>Sequencer transaction flow with the PGA two-stage mempool</title>
  <desc>Transaction flow from a user through an RPC node into the Sequencer. Inside the Sequencer, a two-stage mempool holds an unordered waiting list, and each ordering round promotes the whole list into a priority queue keyed on the priority fee. Block creation takes the highest priority fee first, publishes each transaction to the Fast Feed inside the round, and publishes the closed block to the sequencer feed for full nodes and feed relays. The batch poster sends the compressed sequence to the sequencer inbox on the parent chain, where validators verify it.</desc>
  <defs>
    <linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152c4e"/>
      <stop offset="0.55" stop-color="#1b4add"/>
      <stop offset="1" stop-color="#12aaff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/>
    </marker>
  </defs>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="900" fill="url(#brandbg)"/>
  <rect x="50" y="210" width="200" height="80" rx="12" fill="#12aaff"/>
  <text x="150.0" y="257.0" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">User or app</text>
  <rect x="300" y="210" width="220" height="80" rx="12" fill="#12aaff"/>
  <text x="410.0" y="246.0" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">RPC node</text>
  <text x="410.0" y="272.0" text-anchor="middle" font-size="18" fill="#0b2438" xml:space="preserve">forwarder</text>
  <rect x="580" y="60" width="560" height="510" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.35" stroke-width="1"/>
  <text x="604" y="94" font-size="20" font-weight="600" fill="#eaf5ff">Sequencer</text>
  <rect x="605" y="125" width="510" height="290" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.35" stroke-width="1"/>
  <text x="629" y="159" font-size="20" font-weight="600" fill="#9dcced">Two-stage mempool  ·  new round every 125ms</text>
  <rect x="630" y="175" width="460" height="85" rx="12" fill="#213147"/>
  <text x="860.0" y="213.5" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Waiting list</text>
  <text x="860.0" y="239.5" text-anchor="middle" font-size="18" fill="#c9dcef" xml:space="preserve">unordered  ·  bounded, default 1024</text>
  <rect x="630" y="315" width="460" height="85" rx="12" fill="#e6007a"/>
  <text x="860.0" y="353.5" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Priority queue</text>
  <text x="860.0" y="379.5" text-anchor="middle" font-size="18" fill="#ffffff" xml:space="preserve">keyed on the priority fee</text>
  <rect x="630" y="455" width="460" height="85" rx="12" fill="#213147"/>
  <text x="860.0" y="493.5" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Block creation</text>
  <text x="860.0" y="519.5" text-anchor="middle" font-size="18" fill="#c9dcef" xml:space="preserve">sequential execution</text>
  <rect x="630" y="635" width="460" height="75" rx="12" fill="#213147"/>
  <text x="860.0" y="679.5" text-anchor="middle" font-size="21" font-weight="600" fill="#ffffff">Batch poster</text>
  <rect x="1210" y="140" width="340" height="95" rx="12" fill="#12aaff"/>
  <text x="1380.0" y="183.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">Fast Feed</text>
  <text x="1380.0" y="209.5" text-anchor="middle" font-size="18" fill="#0b2438" xml:space="preserve">Arbitrum One  ·  inside the round</text>
  <rect x="1210" y="290" width="340" height="95" rx="12" fill="#12aaff"/>
  <text x="1380.0" y="333.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">Sequencer feed</text>
  <text x="1380.0" y="359.5" text-anchor="middle" font-size="18" fill="#0b2438" xml:space="preserve">after the block closes</text>
  <rect x="1210" y="440" width="340" height="95" rx="12" fill="#12aaff"/>
  <text x="1380.0" y="483.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">Full nodes and</text>
  <text x="1380.0" y="511.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">feed relays</text>
  <rect x="1180" y="580" width="390" height="250" rx="16" fill="#ffffff" fill-opacity="0.06" stroke="#9dcced" stroke-opacity="0.35" stroke-width="1"/>
  <text x="1204" y="614" font-size="20" font-weight="600" fill="#eaf5ff">Parent chain</text>
  <rect x="1210" y="640" width="330" height="65" rx="12" fill="#12aaff"/>
  <text x="1375.0" y="679.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">Sequencer inbox</text>
  <rect x="1210" y="730" width="330" height="65" rx="12" fill="#12aaff"/>
  <text x="1375.0" y="769.5" text-anchor="middle" font-size="21" font-weight="600" fill="#0b1b2e">Validators</text>
  <path d="M250 250 L290 250" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M520 250 L538 250 Q550 250 550 238 L550 229 Q550 217 562 217 L620 217" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M700 260 L700 305" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M700 400 L700 445" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1090 480 L1138 480 Q1150 480 1150 468 L1150 199 Q1150 187 1162 187 L1200 187" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1090 515 L1168 515 Q1180 515 1180 503 L1180 347 Q1180 337 1190 337 L1200 337" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1380 385 L1380 430" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M700 540 L700 625" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1090 672 L1200 672" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1375 705 L1375 720" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="726" y="271" width="329" height="26" rx="7" fill="#152c4e" opacity="0.94"/>
  <text x="890" y="289" text-anchor="middle" font-size="17" fill="#eaf5ff" xml:space="preserve">Each round promotes the whole list</text>
  <rect x="761" y="413" width="258" height="26" rx="7" fill="#152c4e" opacity="0.94"/>
  <text x="890" y="431" text-anchor="middle" font-size="17" fill="#eaf5ff" xml:space="preserve">Highest priority fee first</text>
  <rect x="50" y="700" width="430" height="150" rx="12" fill="#152c4e" opacity="0.94"/>
  <text x="74" y="734" font-size="18" font-weight="600" fill="#eaf5ff">Key</text>
  <rect x="74" y="756" width="22" height="18" rx="5" fill="#12aaff"/>
  <text x="108" y="771" font-size="17" fill="#eaf5ff">Outside the Sequencer</text>
  <rect x="74" y="786" width="22" height="18" rx="5" fill="#213147" stroke="#9dcced" stroke-width="1"/>
  <text x="108" y="801" font-size="17" fill="#eaf5ff">Sequencer step</text>
  <rect x="74" y="816" width="22" height="18" rx="5" fill="#e6007a"/>
  <text x="108" y="831" font-size="17" fill="#eaf5ff">Where PGA decides the order</text>
  </g>
</svg>
