<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img">
<title>The two-stage mempool</title>
<desc>Transactions arrive into an unordered waiting list. At the start of each PGA round the Sequencer moves the whole waiting list into a priority queue keyed on each transaction's priority fee, highest first.</desc>
<defs>
<linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#152c4e"/><stop offset="0.55" stop-color="#1b4add"/><stop offset="1" stop-color="#12aaff"/>
</linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="270" fill="url(#brandbg)"/>
<g font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<text x="450" y="46" font-size="19" font-weight="600" fill="#9dcced" text-anchor="middle">The Sequencer moves the waiting list into the queue each round</text>
<rect x="25" y="125" width="180" height="80" rx="12" fill="#9dcced"/>
<text x="115" y="158" font-size="18" font-weight="600" fill="#0b1b2e" text-anchor="middle">Arriving</text>
<text x="115" y="184" font-size="18" font-weight="600" fill="#0b1b2e" text-anchor="middle">transactions</text>
<path d="M205 165 L258 165" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="265" y="105" width="240" height="120" rx="14" fill="#213147"/>
<text x="385" y="148" font-size="24" font-weight="600" fill="#ffffff" text-anchor="middle">Waiting list</text>
<text x="385" y="178" font-size="16" font-weight="500" fill="#c9dcef" text-anchor="middle">Unordered</text>
<text x="385" y="202" font-size="16" font-weight="500" fill="#c9dcef" text-anchor="middle">Intake never stops</text>
<path d="M505 165 L628 165" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="504.0" y="127" width="124" height="25" rx="6" fill="#152c4e" opacity="0.92"/>
<text x="566" y="145" font-size="15" font-weight="600" fill="#eaf5ff" text-anchor="middle">Each round</text>
<rect x="635" y="105" width="240" height="120" rx="14" fill="#12aaff"/>
<text x="755" y="148" font-size="24" font-weight="600" fill="#0b1b2e" text-anchor="middle">Priority queue</text>
<text x="755" y="178" font-size="16" font-weight="500" fill="#0b2438" text-anchor="middle">Ordered by priority fee</text>
<text x="755" y="202" font-size="16" font-weight="500" fill="#0b2438" text-anchor="middle">Highest first</text>
</g>
</svg>
