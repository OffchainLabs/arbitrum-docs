<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1062" viewBox="0 0 900 1062"><title>The batch poster path</title><desc>The batch poster pulls sequenced messages from the TransactionStreamer, builds a block, routes the data to a data availability provider, encodes the parent chain transaction as calldata or blobs with a delay proof, verifies the batch, posts the transaction, and lands it in the parent chain SequencerInbox contract. Building a block expands into four substeps: compute the parent chain block bounds, fill batch segments and compress them with adaptive Brotli, decide whether to post now or wait, and CloseAndGetBytes to recompress at a higher level, which returns to building the block. Posting expands into three substeps: fee calculation, nonce management, and sign and send, which returns to posting the transaction.</desc><defs><linearGradient id="brandbg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#152c4e"/><stop offset=".55" stop-color="#17356e"/><stop offset="1" stop-color="#1b4add"/></linearGradient><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#9dcced" d="m0 0 10 5-10 5z"/></marker></defs><path fill="url(#brandbg)" d="M0 0h900v1062H0z"/><g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><rect width="352" height="78" x="36" y="108" fill="#213147" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="139" fill="#fff" font-size="21" font-weight="600" text-anchor="middle">TransactionStreamer</text><text x="212" y="164" fill="#c9dcef" font-size="18.5" text-anchor="middle">(sequenced messages)</text><rect width="352" height="78" x="36" y="238" fill="#12aaff" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="284" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Build block</text><rect width="352" height="78" x="36" y="368" fill="#213147" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="414" fill="#fff" font-size="21" font-weight="600" text-anchor="middle">DA routing</text><rect width="352" height="78" x="36" y="498" fill="#213147" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="529" fill="#fff" font-size="21" font-weight="600" text-anchor="middle">Encode parent chain transaction</text><text x="212" y="554" fill="#c9dcef" font-size="18.5" text-anchor="middle">(calldata/blobs + DelayProof)</text><rect width="352" height="78" x="36" y="628" fill="#213147" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="674" fill="#fff" font-size="21" font-weight="600" text-anchor="middle">Batch verification</text><rect width="352" height="78" x="36" y="758" fill="#12aaff" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="804" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Post transaction</text><rect width="352" height="78" x="36" y="888" fill="#e6007a" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="212" y="929" fill="#fff" font-size="21" font-weight="600" text-anchor="middle">SequencerInbox contract</text><text x="212" y="954" fill="#fff" font-size="18.5" text-anchor="middle">(on the parent chain)</text><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 186v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 316v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 446v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 576v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 706v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M212 836v50"/><rect width="352" height="78" x="512" y="34" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="65" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Compute block bounds</text><text x="688" y="90" fill="#0b2438" font-size="18.5" text-anchor="middle">(on the parent chain)</text><rect width="352" height="78" x="512" y="154" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="185" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Fill batch segments</text><text x="688" y="210" fill="#0b2438" font-size="18.5" text-anchor="middle">(compress with adaptive Brotli)</text><path fill="#12aaff" stroke="#9dcced" stroke-opacity=".75" stroke-width="2.4" d="M536 274h304l24 24v30l-24 24H536l-24-24v-30Z"/><text x="688" y="305" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Decide:</text><text x="688" y="330" fill="#0b1b2e" font-size="21" text-anchor="middle">post now or wait?</text><rect width="352" height="78" x="512" y="394" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="425" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">CloseAndGetBytes</text><text x="688" y="450" fill="#0b2438" font-size="18.5" text-anchor="middle">(recompress at higher level)</text><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M688 112v40"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M688 232v40"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M688 352v40"/><path fill="none" stroke="#9dcced" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#arrow)" d="M388 264h30q12 0 12-12V85q0-12 12-12h66"/><path fill="none" stroke="#9dcced" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#arrow)" d="M512 433h-32q-12 0-12-12V302q0-12-12-12h-64"/><rect width="352" height="78" x="512" y="628" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="674" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Fee calculation</text><rect width="352" height="78" x="512" y="758" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="804" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Nonce management</text><rect width="352" height="78" x="512" y="888" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.8" rx="12"/><text x="688" y="934" fill="#0b1b2e" font-size="21" font-weight="600" text-anchor="middle">Sign and send</text><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M688 706v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M688 836v50"/><path fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)" d="M388 667h120"/><path fill="none" stroke="#9dcced" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#arrow)" d="M512 927h-48q-12 0-12-12V809q0-12-12-12h-48"/><rect width="22" height="16" x="109.9" y="999" fill="#213147" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.2" rx="4"/><text x="140.9" y="1012" fill="#eaf5ff" font-size="17">Batch poster step</text><rect width="22" height="16" x="321.2" y="999" fill="#12aaff" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.2" rx="4"/><text x="352.2" y="1012" fill="#eaf5ff" font-size="17">Key step</text><rect width="22" height="16" x="452.9" y="999" fill="#9dcced" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.2" rx="4"/><text x="483.9" y="1012" fill="#eaf5ff" font-size="17">Substep</text><rect width="22" height="16" x="575.8" y="999" fill="#e6007a" stroke="#9dcced" stroke-opacity=".55" stroke-width="1.2" rx="4"/><text x="606.8" y="1012" fill="#eaf5ff" font-size="17">Parent chain contract</text></g></svg>