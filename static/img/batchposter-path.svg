<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1062" width="900" height="1062" role="img">
<title>The batch poster path</title>
<desc>The batch poster pulls sequenced messages from the TransactionStreamer, builds a block, routes the data to a data availability provider, encodes the L1 transaction as calldata or blobs with a delay proof, verifies the batch, posts the transaction, and lands it in the L1 SequencerInbox contract. Building a block expands into four substeps: compute L1 block bounds, fill batch segments and compress them with adaptive Brotli, decide whether to post now or wait, and CloseAndGetBytes to recompress at a higher level, which returns to building the block. Posting expands into three substeps: fee calculation, nonce management, and sign and send, which returns to posting the transaction.</desc>
<defs>
<linearGradient id="brandbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#152c4e"/><stop offset="0.55" stop-color="#17356e"/><stop offset="1" stop-color="#1b4add"/>
</linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#9dcced"/>
</marker>
</defs>
<rect x="0" y="0" width="900" height="1062" fill="url(#brandbg)"/>
<g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<rect x="36" y="108" width="352" height="78" rx="12" fill="#213147" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="139" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">TransactionStreamer</text>
<text x="212.0" y="164" font-size="18.5" fill="#c9dcef" text-anchor="middle">(sequenced messages)</text>
<rect x="36" y="238" width="352" height="78" rx="12" fill="#12aaff" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="284" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Build block</text>
<rect x="36" y="368" width="352" height="78" rx="12" fill="#213147" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="414" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">DA routing</text>
<rect x="36" y="498" width="352" height="78" rx="12" fill="#213147" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="529" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Encode L1 transaction</text>
<text x="212.0" y="554" font-size="18.5" fill="#c9dcef" text-anchor="middle">(calldata/blobs + DelayProof)</text>
<rect x="36" y="628" width="352" height="78" rx="12" fill="#213147" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="674" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">Batch verification</text>
<rect x="36" y="758" width="352" height="78" rx="12" fill="#12aaff" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="804" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Post transaction</text>
<rect x="36" y="888" width="352" height="78" rx="12" fill="#e6007a" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="212.0" y="934" font-size="21" font-weight="600" fill="#ffffff" text-anchor="middle">L1 SequencerInbox contract</text>
<path d="M212.0 186 L212.0 236" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M212.0 316 L212.0 366" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M212.0 446 L212.0 496" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M212.0 576 L212.0 626" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M212.0 706 L212.0 756" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M212.0 836 L212.0 886" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="512" y="34" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="80" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Compute L1 block bounds</text>
<rect x="512" y="154" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="185" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Fill batch segments</text>
<text x="688.0" y="210" font-size="18.5" fill="#0b2438" text-anchor="middle">(compress with adaptive Brotli)</text>
<path d="M536 274 L840 274 L864 298 L864 328 L840 352 L536 352 L512 328 L512 298 Z" fill="#12aaff" stroke="#9dcced" stroke-opacity="0.75" stroke-width="2.4"/>
<text x="688.0" y="305" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Decide:</text>
<text x="688.0" y="330" font-size="21" fill="#0b1b2e" text-anchor="middle">post now or wait?</text>
<rect x="512" y="394" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="425" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">CloseAndGetBytes</text>
<text x="688.0" y="450" font-size="18.5" fill="#0b2438" text-anchor="middle">(recompress at higher level)</text>
<path d="M688.0 112 L688.0 152" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M688.0 232 L688.0 272" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M688.0 352 L688.0 392" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M388 264 L418 264 Q430 264 430 252 L430 85 Q430 73 442 73 L508 73" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M512 433 L480 433 Q468 433 468 421 L468 302 Q468 290 456 290 L392 290" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="512" y="628" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="674" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Fee calculation</text>
<rect x="512" y="758" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="804" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Nonce management</text>
<rect x="512" y="888" width="352" height="78" rx="12" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.8"/>
<text x="688.0" y="934" font-size="21" font-weight="600" fill="#0b1b2e" text-anchor="middle">Sign and send</text>
<path d="M688.0 706 L688.0 756" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M688.0 836 L688.0 886" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M388 667 L508 667" fill="none" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M512 927 L464 927 Q452 927 452 915 L452 809 Q452 797 440 797 L392 797" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke="#9dcced" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="152.9" y="999" width="22" height="16" rx="4" fill="#213147" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="183.9" y="1012" font-size="17" fill="#eaf5ff">Batch poster step</text>
<rect x="364.2" y="999" width="22" height="16" rx="4" fill="#12aaff" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="395.2" y="1012" font-size="17" fill="#eaf5ff">Key step</text>
<rect x="495.9" y="999" width="22" height="16" rx="4" fill="#9dcced" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="526.9" y="1012" font-size="17" fill="#eaf5ff">Substep</text>
<rect x="618.8" y="999" width="22" height="16" rx="4" fill="#e6007a" stroke="#9dcced" stroke-opacity="0.55" stroke-width="1.2"/>
<text x="649.8" y="1012" font-size="17" fill="#eaf5ff">L1 contract</text>
</g>
</svg>
