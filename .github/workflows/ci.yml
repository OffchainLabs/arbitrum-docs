name: CI

# Run the gates for the migration's `fumadocs` review base as well as the production/default
# branches. A PR targeting `fumadocs` otherwise gets no CI checks.
on:
  push:
    branches: [main, master, fumadocs]
  pull_request:
    branches: [main, master, fumadocs]

permissions:
  contents: read

# The pre-commit hook is for working copies; here the same checks run as gates. HUSKY=0 also
# stops `pnpm install` from writing .husky/_ into the runner's checkout.
env:
  HUSKY: 0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check (regenerates .source/, then tsc)
        run: pnpm types:check

      - name: Script test suites
        run: pnpm test

      - name: Global variables resolve
        run: pnpm vars:check

      - name: Navigation integrity
        run: pnpm nav:check

      - name: Partials resolve and stay unrouted
        run: pnpm partials:check

      - name: Archived page registry
        run: node scripts/versioned-docs-check.ts

      - name: Glossary references resolve
        run: pnpm references:check

      - name: FAQ data is current
        run: pnpm faq:check

      - name: Contract address reference is current
        run: pnpm contracts:check

      - name: Remote Markdown images are absent
        run: pnpm images:presence

      # Fumadocs has no `onBrokenLinks: 'throw'`, and `pnpm build` does not check links,
      # so this step is the only thing standing between a broken link and main.
      # Caveat: check-links does not validate anchors — a live page with a dead #anchor passes.
      - name: Internal links
        run: pnpm check-links

      # Reached zero on 2026-09-21 and moved up from `content-debt`. A1 and A4 were cleared in
      # 0e5a64a, A2 and A5 in 297730a, and A6 shipped at zero with the defect it names.
      - name: MDX structural lint
        run: pnpm content:lint

      # Reached zero on 2026-09-24: MDX joined Prettier's scope, and the files the tooling writes
      # (meta.json, redirects.*.mjs) moved to .prettierignore instead of being formatted once.
      - name: Formatting
        run: pnpm format:check

  build:
    # The HTTP checks exercise the built routes and response headers. They need a
    # production build and must fail the PR if routing or cache behavior regresses.
    name: Build and HTTP smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Built docs HTTP smoke tests
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/arbitrum-docs-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/llms.txt > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/arbitrum-docs-next-start.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --show-error --fail http://127.0.0.1:3000/llms.txt > /dev/null
          STATIC_DOCS_TEST_URL=http://127.0.0.1:3000 node --test scripts/static-docs-http.test.ts
