name: CI

# Run the gates for the migration's `fumadocs` review base as well as the production/default
# branches. A PR targeting `fumadocs` otherwise gets no CI checks.
on:
  push:
    branches: [main, master, fumadocs]
  pull_request:
    branches: [main, master, fumadocs]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check (regenerates .source/, then tsc)
        run: pnpm types:check

      # types:check never applies the page schema; only compiling a page does. This applies it to
      # every page, so a frontmatter mistake fails here instead of in the build job.
      - name: Page frontmatter matches the schema
        run: pnpm frontmatter:check

      - name: Script test suites
        run: pnpm test

      - name: Global variables resolve
        run: pnpm vars:check

      - name: Glossary references resolve
        run: pnpm references:check

      - name: Contract address reference is current
        run: pnpm contracts:check

      - name: FAQ partials match their Notion snapshots
        run: pnpm faq:check

      # Fumadocs has no `onBrokenLinks: 'throw'`. `pnpm build` runs check-links too, so a broken
      # link also fails the deploy; this step reports it on its own. Fragments are validated
      # against the real MDX transforms, so a dead #anchor fails as well.
      - name: Internal links
        run: pnpm check-links

      - name: MDX that builds but renders wrong
        run: pnpm content:lint

      # MDX is in Prettier's scope; files the tooling writes (meta.json) are in .prettierignore.
      - name: Formatting
        run: pnpm format:check

  build:
    # The HTTP checks exercise the built routes and response headers. They need a
    # production build and must fail the PR if routing or cache behavior regresses.
    name: Build and HTTP smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Install Chromium for browser regression tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Built docs HTTP and browser tests
        run: |
          pnpm start --hostname 127.0.0.1 --port 3000 > /tmp/arbitrum-docs-next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:3000/llms.txt > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/arbitrum-docs-next-start.log
              exit 1
            fi
            sleep 1
          done

          curl --silent --show-error --fail http://127.0.0.1:3000/llms.txt > /dev/null
          STATIC_DOCS_TEST_URL=http://127.0.0.1:3000 node --test scripts/static-docs-http.test.ts
          STATIC_DOCS_TEST_URL=http://localhost:3000 pnpm test:browser
