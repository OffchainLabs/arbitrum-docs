name: Nitro bump

# Applies an agreed Nitro release bump and opens the PR. The decision is made in the
# "Nitro vX.Y.Z is available" issue that `upstream-refresh.yml` opens; this job only does the
# mechanical part: `nitro:check-release --to <version>` plus the two generators that embed the
# pinned tag. The support policy page and the release-notes review stay human work.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Nitro release tag, for example v3.11.5'
        required: true
        type: string

concurrency:
  group: nitro-bump
  cancel-in-progress: false

permissions:
  contents: read # default for any job that does not narrow it

jobs:
  bump:
    name: Bump the pinned Nitro release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/nitro-bump branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version reaches the shell through `env`, never through `${{ }}` inside `run`.
      - name: Bump the pinned Nitro release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: pnpm nitro:check-release --to "$VERSION"

      - name: Regenerate precompile tables
        run: pnpm precompiles:generate

      # Reads the Nitro source at the new tag over git and the network; no Go toolchain needed.
      - name: Regenerate the CLI flags page
        run: pnpm cli:generate

      # zizmor suggests `gh pr create`, which would mean hand-rolling the branch/commit/push
      # plumbing. create-pull-request does all of that. The ignore comment sits on the `uses:`
      # line because zizmor only honours one inside the finding's span.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/nitro-bump
          delete-branch: true
          commit-message: 'Bump Nitro to ${{ inputs.version }}'
          title: 'Bump Nitro to ${{ inputs.version }}'
          body: |
            Bumps the pinned Nitro release to `${{ inputs.version }}`, as agreed in the
            "Nitro ${{ inputs.version }} is available" issue.

            What this job changed:

            - `content/vars.json`: `nitroVersionTag`, `latestNitroNodeImage` and `goEthereumCommit`
            - the node image in every page carrying a `sync-with-var: latestNitroNodeImage` marker
            - `content/partials/precompile-tables/`: regenerated at the new refs
            - `content/docs/run-a-node/nitro/cli-flags-reference.mdx`: regenerated from the new
              tag's Go source

            Still human-only before merging:

            - [ ] Update the Nitro support policy page
              (`content/docs/run-a-node/nitro-support-policy.mdx`)
            - [ ] Review the release notes for node configuration changes the docs describe
            - [ ] Run the gates locally: this PR gets no CI run of its own

            Generated by the `nitro-bump` workflow. Reproduce locally with
            `pnpm nitro:check-release --to ${{ inputs.version }} && pnpm precompiles:generate && pnpm cli:generate`.
