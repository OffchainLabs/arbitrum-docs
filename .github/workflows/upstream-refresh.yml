name: Upstream refresh

# Maintenance at the pinned Nitro release, plus a notice when a newer one exists. It never
# changes `nitroVersionTag`: which release the docs describe is a human decision, taken in
# the issue this job opens and applied by the `nitro-bump` workflow.
#
# Two outcomes, independent of each other:
# - A PR on `automated/upstream-refresh` when the precompile tables changed at the pinned
#   release. Nothing is opened when the tree is clean. A stale go-ethereum submodule pin is
#   reported in the job log, never written: a human repairs it with `--to`.
# - One issue "Nitro vX.Y.Z is available" per newer release, with the bump checklist.
#
# The generator runs unconditionally rather than only after a pin change: the tables also
# go stale when a pin in the generator changes, or when a doc comment is edited upstream at
# the same commit.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: upstream-refresh
  cancel-in-progress: false

permissions:
  contents: read # default for any job that does not narrow it

jobs:
  refresh:
    name: Refresh generated content
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/upstream-refresh branch; never writes to main
      pull-requests: write # open the PR for that branch
      issues: write # "Open a release notice" creates the "Nitro vX.Y.Z is available" issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check the pinned Nitro release
        id: nitro
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm nitro:check-release

      - name: Regenerate precompile tables
        run: pnpm precompiles:generate

      # zizmor: ignore[superfluous-actions]
      # zizmor suggests `gh pr create`, which would mean hand-rolling the branch/commit/push
      # plumbing and a "did anything change?" check. create-pull-request does all of that and
      # no-ops when the tree is clean, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/upstream-refresh
          delete-branch: true
          commit-message: 'chore: refresh generated content at the pinned Nitro release'
          title: 'chore: refresh generated content at the pinned Nitro release'
          body: |
            Automated refresh of content generated from upstream sources. The pinned Nitro
            release (`nitroVersionTag`) was not changed; a bump goes through the
            "Nitro vX.Y.Z is available" issue and the `nitro-bump` workflow.

            What can change here:

            - `content/partials/precompile-tables/`: regenerated from the Solidity
              interfaces and Go implementations at the pinned refs

            `content/vars.json` is never written by this workflow. A stale `goEthereumCommit`
            is reported in the "Check the pinned Nitro release" job log and repaired by a
            human with `pnpm nitro:check-release --to <pinned tag>`.

            Generated by the `upstream-refresh` workflow. Reproduce locally with
            `pnpm nitro:check-release && pnpm precompiles:generate`.

      # The version reaches the shell through `env`, never through `${{ }}` inside `run`:
      # a templated value in a script is what zizmor's template-injection rule flags.
      - name: Open a release notice
        if: steps.nitro.outputs.newer_release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.nitro.outputs.newer_release }}
        run: |
          title="Nitro $VERSION is available"
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json number --jq length)
          if [ "$existing" != "0" ]; then
            echo "an issue titled '$title' already exists; nothing to open"
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          Nitro $VERSION is published and the docs pin an older release. Bumping is a decision, not
          a refresh; this checklist is the decision.

          - [ ] Read the release notes at https://github.com/OffchainLabs/nitro/releases/tag/$VERSION for node configuration changes
          - [ ] Agree on the target version
          - [ ] Update the Nitro support policy page (\`content/docs/run-a-node/nitro-support-policy.mdx\`)
          - [ ] Run the \`nitro-bump\` workflow with that version, or locally \`pnpm nitro:check-release --to $VERSION && pnpm precompiles:generate && pnpm cli:generate\`
          - [ ] Open the PR and run the gates locally: the automated PR gets no CI run

          Opened by the \`upstream-refresh\` workflow.
          EOF
          )"
