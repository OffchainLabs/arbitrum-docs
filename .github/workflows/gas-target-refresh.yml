name: Gas-target refresh

# Re-reads the gas targets of Arbitrum One, Nova and Sepolia from the `ArbGasInfo` precompile
# over their three public RPCs and opens a PR when the snapshot or the generated partial
# changed. Nothing is opened when the tree is clean. No secret is needed: the RPCs are public
# and the calls are read-only. The PR gets no CI run of its own (it is opened with
# GITHUB_TOKEN), so the reviewer runs the gates locally. CI never calls an RPC; only this
# workflow does.

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays, 08:00 UTC
  workflow_dispatch:

concurrency:
  group: gas-target-refresh
  cancel-in-progress: false

permissions:
  contents: read # default for any job that does not narrow it

jobs:
  refresh:
    name: Refresh the gas-target snapshot and partial
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the automated/gas-target-refresh branch; never writes to main
      pull-requests: write # open the PR for that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Read the gas targets from the public RPCs
        run: pnpm gas-target:fetch

      - name: Regenerate the gas-target partial
        run: pnpm gas-target:generate

      # zizmor: ignore[superfluous-actions]
      # zizmor suggests `gh pr create`, which would mean hand-rolling the branch/commit/push
      # plumbing and a "did anything change?" check. create-pull-request does all of that and
      # no-ops when the tree is clean, which is the normal outcome of a weekly run.
      - name: Open a pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automated/gas-target-refresh
          delete-branch: true
          commit-message: 'Refresh the gas-target partial from ArbGasInfo'
          title: 'Refresh the gas-target partial from ArbGasInfo'
          body: |
            Automated refresh of the gas-target reference partial from the `ArbGasInfo`
            precompile on Arbitrum One, Nova and Sepolia.

            What can change here:

            - `scripts/data/gas-target.json`: the snapshot; review this for content
            - `content/partials/_reference-gas-target-partial.mdx`: regenerated from the snapshot

            This PR gets no CI run of its own. Before merging, run the gates locally:
            `pnpm gas-target:check && pnpm lint && pnpm check-links && pnpm format:check`.

            Generated by the `gas-target-refresh` workflow. Reproduce locally with
            `pnpm gas-target:fetch && pnpm gas-target:generate`.
