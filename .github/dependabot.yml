# Dependabot configuration.
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Routine version updates are batched into a single weekly PR per ecosystem, held
# for 7 days after release so freshly published versions are not pulled in
# immediately. Security advisories are handled by GitHub's separate Dependabot
# security-updates feature (Settings → Code security), which ignores both the
# schedule and the cooldown and opens individual PRs as soon as a match is found.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node aligned with the Node runtime in engines (22.x). Major bumps
      # ship type definitions for newer Node lines than we run, which lets tsc approve
      # APIs absent at runtime. Minor/patch updates still flow.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'

  # Keeps the SHA pins in .github/workflows/ current; without this they never move.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(actions)'
