# The form values the widget and the static SVG share. Per-lane and per-kind colors are in
# project.yaml. Every key is required, and an unknown key fails.
# The widget canvas background.
gradient: 'linear-gradient(180deg, #152c4e 0%, #1b4add 55%, #12aaff 100%)'
# Widget: an inactive edge and its arrowhead, the step bar border, the key swatch outline.
connector: '#9dcced'
# Widget: an active edge, the border of an active box and of the Next button.
active: '#eaf5ff'
activeGlow: '0 0 0 5px rgba(18, 170, 255, 0.45)'
# Widget: the Next button glow before the first step.
startGlow: '0 0 0 3px rgba(18, 170, 255, 0.6)'
# Widget: the focus ring on the canvas controls. The site focus ring, #016be5, has about 2.8:1
# contrast on `chip`.
focus: '#eaf5ff'
# Both: the background of an edge label, a band name, the key and the step bar.
chip: '#152c4e'
# Both: the text on `chip`. The SVG also draws its arrows and key text in it.
ink: '#eaf5ff'
# Widget: the step number badges on an edge label.
badge: '#12aaff'
badgeText: '#0b1b2e'
# Both: every label.
font: "Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
# Widget: the opacity of an inactive box and edge.
dimmed: 0.35
